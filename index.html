-22", "a": "전병현", "v": 428, "u": "03_후기모음/posts/001_2018-02-22_이공계연수사업(IOT교육) 후기.html", "i": "", "s": "처음 이 수업을 듣게 되었을 때 어떤 것을 배우게 될지, 취업을 하는데에 있어 도움이 잘 될지 불안한 마음이 있었습니다. 하지만 강의를 해주는 선생님들이 최선을 다해 가르쳐주고 또 친근한 모습으로 다가와 주어 즐겁게 공부할 수 있었습니다. 또 같이 교…", "y": "2018", "n": 0}, {"t": "이공계연수사업(IOT교육) 후기", "d": "2018-02-22", "a": "임동영", "v": 379, "u": "03_후기모음/posts/002_2018-02-22_이공계연수사업(IOT교육) 후기.html", "i": "", "s": "웹과 안드로이드에 대해 배우고자 이 교육을 들었습니다. 학교에서 자바에 대해 교육을 받았었습니다. 하지만 배운지 오래 되어서 새로배우는 느낌이였습니다. 그러나 강의를 잘 해주시는 선생님들과 같이 교육 받으며 잘 알려주는 교육생들이 있어서 잘 해낼 수 …", "y": "2018", "n": 0}, {"t": "이공계연수사업(IOT교육) 후기", "d": "2018-02-22", "a": "조영준", "v": 384, "u": "03_후기모음/posts/003_2018-02-22_이공계연수사업(IOT교육) 후기.html", "i": "", "s": "처음에 교수님 추천으로 프로그래밍언어만 학습할줄 알았는데 컴퓨터와 관련된 다른 분야들도 배울 수 있어서 견문 지식도 쌓을 수 있어 좋았습니다. 이렇게 다양한 분야 과목들을 학습하므로서 한가지 분야만이 아닌 여러 다른 분야에도 활용 범위를 넓힐 수 있다…", "y": "2018", "n": 0}, {"t": "이공계연수사업(IOT교육) 후기", "d": "2018-02-22", "a": "whsksdud123", "v": 372, "u": "03_후기모음/posts/004_2018-02-22_이공계연수사업(IOT교육) 후기.html", "i": "", "s": "[ 딱딱하게만 느껴졌던 '코딩'이 봄처럼 다가오다... ] 소프트웨어전공 학과 학생으로써 IT 교육을 신청한다는 것이 쉽지만은 않았습니다. 3개월이라는 짧지 않은 시간 동안 열심히 할 수 있을까 하는 걱정이 앞섰지만 취업이라는 목표 하나만으로 마음을 …", "y": "2018", "n": 0}, {"t": "비전공자 수강후기 *완전추천*", "d": "2018-02-22", "a": "이화정", "v": 425, "u": "03_후기모음/posts/005_2018-02-22_비전공자 수강후기 완전추천.html", "i": "", "s": "안녕하세요! 저는 9월부터 12월까지 IoT기반 SW융합서비스개발자과정을 수강하였습니다. 결론부터 말하자면 완전 추천합니다!! 사실 저는 외국어를 전공한 비전공자로 IT계열에 대해서는 문외한이었습니다. 스마트폰의 보급과 미디어의 영향으로 어플이나 사물…", "y": "2018", "n": 1}, {"t": "이공계연수사업(IOT교육) 후기", "d": "2018-02-22", "a": "jh y", "v": 286, "u": "03_후기모음/posts/006_2018-02-22_이공계연수사업(IOT교육) 후기.html", "i": "", "s": "교육을 듣고 프로젝트를 해봄으로써 많이 배우고 갑니다. 짧은 기간이었지만 학교에서의 수업으로는 배울 수 없는 것들을 배울 수 있었습니다. 이쪽 분야 전공의 대학생들은 이런 교육을 한번쯤 해보는 것도 괜찮은 경험이 될듯합니다. 작성자 : 양재혁", "y": "2018", "n": 0}, {"t": "IoT교육 후기", "d": "2018-02-22", "a": "김민호", "v": 286, "u": "03_후기모음/posts/007_2018-02-22_IoT교육 후기.html", "i": "", "s": "2018년 상반기 공채가 시작되기 전 시간을 허비하지 않기 위해 교육을 수강했는데 생각보다 정말 배울 것이 많았고, 알차서 좋았습니다. 이번 교육에서 배운 내용을 토대로 취업할 때에도 유용하게 사용할 것 같아 의미있는 교육이었습니다.", "y": "2018", "n": 0}, {"t": "[빅데이터분석전문가 과정] 전공이지만 길을 찾지 못한 대학생에서 지금의 나는...", "d": "2018-02-25", "a": "남진혁", "v": 321, "u": "03_후기모음/posts/008_2018-02-25_[빅데이터분석전문가 과정] 전공이지만 길을 찾지 못한 대학생에서 지금의 나는.html", "i": "", "s": "저는 4년제 컴퓨터공학과를 다니는 평범한 대학생이었습니다. 학점은 4점대를 넘길 정도로 남들도 보기에도 학업에 성실히 임해 온 사람이었습니다. 하지만 실무보다는 이론에 중심인 학교 교육으로 인해 막상 프로그래밍이라는 단어는 제게 어렵게 다가왔고 심지어…", "y": "2018", "n": 1}, {"t": "[융합과 연결] 코딩을 모르던 청년 스마트라는 날개를 달다! (*리얼후기)", "d": "2018-02-26", "a": "박병관", "v": 273, "u": "03_후기모음/posts/009_2018-02-26_[융합과 연결] 코딩을 모르던 청년 스마트라는 날개를 달다! ( 리얼후기).html", "i": "", "s": "- 4차산업혁명 핵심 키워드 융합과 연결 - 때는 바야흐로 2017년 3월, 따듯한 햇살이 비치고 봄바람이 불어와 누군가의 마음을 설레게 할 계절. 하지만 막 대학 졸업을 마친 저에게는 그 따듯한 봄마저도 누구보다 차갑게만 느껴졌습니다. 대한민국 청년…", "y": "2018", "n": 0}, {"t": "이공계연수사업(IOT교육) 후기 (추경A)", "d": "2018-02-26", "a": "박준영", "v": 252, "u": "03_후기모음/posts/010_2018-02-26_이공계연수사업(IOT교육) 후기 (추경A).html", "i": "", "s": "2017년 하반기 공채가 끝날쯔음... 이제 뭐하지? 라는 고민을 하던 중 우연히 이번 교육을 알게 되어 신청하게 되었습니다. ‘프로젝트 기반 사물인터넷 융합서비스 개발자 과정’ !!! Java, Web, Arduino 등 새로운 것을 배울 수 있었습…", "y": "2018", "n": 0}, {"t": "2017 4차산업혁명 선도인력양성 사업-사물인터넷기반 Web서비스 개발자과정-후기임.", "d": "2018-02-26", "a": "정승현", "v": 261, "u": "03_후기모음/posts/011_2018-02-26_2017 4차산업혁명 선도인력양성 사업-사물인터넷기반 Web서비스 개발자과정-후기임.html", "i": "", "s": "내가 과정을 이수하면서 느꼈던 생각을 그대로 써본다.^^ [수업] 내가 수강 신청할 당시 web서비스 개발과정과, mobile 개발과정이 개설 돼 있었다.개발자과정이 시작되기 전에 사전평가를 통하여 학생 스스로 교육에 대한 준비를 하게 했고 최종 면접…", "y": "2018", "n": 0}, {"t": "IOT 개발자 과정 후기", "d": "2018-02-26", "a": "pshok", "v": 384, "u": "03_후기모음/posts/012_2018-02-26_IOT 개발자 과정 후기.html", "i": "", "s": "안녕하세요 저는 17년도 4월부터 9월 말까지 약 5~6개월의 IOT 개발자 과정을 이수했습니다. 현재는 대전의 IT 기업에서 기획 및 경영관리 업무를 전담하고 있습니다. 교육을 듣기 전의 저는 당시 경제학이라는 학문을 전공한 후 졸업을 앞두고 진로에…", "y": "2018", "n": 0}, {"t": "빅데이터활용 Web+App 서비스 개발자 과정", "d": "2018-02-27", "a": "김예찬", "v": 297, "u": "03_후기모음/posts/013_2018-02-27_빅데이터활용 Web+App 서비스 개발자 과정.html", "i": "", "s": "이번방학때 빅데이터활용 과정을 들었습니다. 저는 컴퓨터공학과이지만 정 단기 후기.html", "i": "", "s": "안녕하세요. 전남대학교를 다니고있는 산업공학과 유경도입니다. 먼저 위 과정을 수강하게 된 계기는 평소 4차 산업혁명 뉴스를 보면서 컴퓨터 관련하여 관심이 있었지만 학과 특성상 프로그래밍을 심도 있게 다루지 않아서 위 와 같은 교육과정을 통해 프로그래밍…", "y": "2019", "n": 0}, {"t": "PBL기반 빅데이터 분석 전문가 단기과정 후기", "d": "2019-08-28", "a": "변진애", "v": 316, "u": "03_후기모음/posts/045_2019-08-28_PBL기반 빅데이터 분석 전문가 단기과정 후기.html", "i": "", "s": "안녕하세요 저는 원래 인문대 학생입니다. 복수전공을 빅데이터와 관련된 이공계로 하게 되었고 주변선배의 추천으로 빅데이터 분석 단기 과정을 듣게 되었습니다. 파이썬, R, 머신러닝, 딥러닝, 하둡 등 혼자서는 절대로 한두달만에 배울 수 없다고 생각합니다…", "y": "2019", "n": 0}, {"t": "딥러닝 기반 에너지 빅데이터 응용 SW 전문가 과정 수료후기", "d": "2019-08-29", "a": "허원식", "v": 285, "u": "03_후기모음/posts/046_2019-08-29_딥러닝 기반 에너지 빅데이터 응용 SW 전문가 과정 수료후기.html", "i": "", "s": "잘 짜여진 커리큘럼과 좋은 선생님, 좋은 기회였습니다. 4개월이라는 기간 동안 프로그래밍 언어에 대한 전반적인 지식과 개념을 확립할 수 있어서 좋았고, 실습을 통해 머신러닝, 딥러닝, 웹어플리케이션 등의 작동원리에 대해서도 이해할 수 있었습니다. 프로…", "y": "2019", "n": 0}, {"t": "IOT기반 수료 후기", "d": "2019-11-02", "a": "fshdfghdhfg", "v": 277, "u": "03_후기모음/posts/047_2019-11-02_IOT기반 수료 후기.html", "i": "", "s": "비전공자가 배우기에 정말 좋습니다. 선생님들이 아주 잘 알려주십니다", "y": "2019", "n": 0}, {"t": "스마트그리드기반 IoT융합 SW 전문가과정 후기", "d": "2019-11-02", "a": "수제육즙", "v": 409, "u": "03_후기모음/posts/048_2019-11-02_스마트그리드기반 IoT융합 SW 전문가과정 후기.html", "i": "", "s": "면접 준비하는게 정말 도움이 많이 됐습니다. 학교에서 프로젝트했던 것도 있지만 오래되서 잘 기억이 나지 않고 팀원들과 함께 어우러져서 새로운 것을 만들고 같이 날을 새가며 준비 했던 모든 것들이 면접 때 유용하게 쓰일 수 있었고 면접관도 보다 관심을 …", "y": "2019", "n": 0}, {"t": "스마트그리드 IoT후기", "d": "2019-11-02", "a": "김익명", "v": 322, "u": "03_후기모음/posts/049_2019-11-02_스마트그리드 IoT후기.html", "i": "", "s": "5개월정도 투자할 가치가 있고 재미있는 프로그램이였습니다. 다만 프로젝트 기간이 촉박하다는 점, 그리고 후기에 익명성이 보장이 되지않는다는 점은 아쉽네요. 그외엔 전부 좋았습니다.", "y": "2019", "n": 0}, {"t": "비전공자가 들은 스마트그리드기반 IoT융합 SW전문가과정", "d": "2019-11-02", "a": "운비", "v": 285, "u": "03_후기모음/posts/050_2019-11-02_비전공자가 들은 스마트그리드기반 IoT융합 SW전문가과정.html", "i": "", "s": "코딩에 '코'자도 모르던 상태로 들어와서, 죄송하다고 시험지를 백지로 냈는데 지금은 나름 코딩 초짜는 벗어난 것 같습니다. 기초부터 차근차근 가르쳐주시는게 너무 좋았고 도움이 됬습니다. 취업을 어디로 할까 고민을 많이 하면서 방황하다 들은 교육과정이었…", "y": "2019", "n": 0}, {"t": "스마트그리드기반 : "2021", "n": 0}, {"t": "비전공자 후기", "d": "2021-04-15", "a": "재현", "v": 555, "u": "03_후기모음/posts/141_2021-04-15_비전공자 후기.html", "i": "", "s": "처음 접해보는 과목입니다. 해본적 없기 때문에 시작이 많이 어려웠지만 끝가지 포기 하지 않고 하시면 수료하는 그날에는 달라져 있는 본인의 모습을 볼수 있습니다. 다소 어려울수도 있습니다. 하지만 많은 선생님들과 전공자들의 도움을 얻으면서 그걸 내껄로 …", "y": "2021", "n": 0}, {"t": "비전공자 수료 후기", "d": "2021-04-15", "a": "오인정", "v": 403, "u": "03_후기모음/posts/142_2021-04-15_비전공자 수료 후기.html", "i": "", "s": "한번도 IT관련 수업을 들어본 적이 없었는데, 스마트인재개발원 강의를 들으며 모든 내용을 처음으로 접했기 때문에 처음엔 수업내용을 따라가기에 너무 어려웠지만, 몇번이고 같은 질문에도 친절하게 설명해주시는 선생님들과, 같이 수업을 듣는 짝꿍과 팀원들의 …", "y": "2021", "n": 0}, {"t": "SMHRD 빅데이터 개발자과정 후기", "d": "2021-04-15", "a": "김지용", "v": 317, "u": "03_후기모음/posts/143_2021-04-15_SMHRD 빅데이터 개발자과정 후기.html", "i": "", "s": "많이 힘듭니다. 대신 힘든 만큼 확실히 공부할 수 있습니다! 소프트웨어 개발 확실하게 공부하고 싶으신 분은 SMHRD로 오세요! 후회하지 않으실 겁니다.", "y": "2021", "n": 0}, {"t": "감사하고 고맙습니다 ^^", "d": "2021-04-15", "a": "hjkim4500", "v": 342, "u": "03_후기모음/posts/144_2021-04-15_감사하고 고맙습니다 ^^.html", "i": "", "s": "공부하는 부분이 많이 어렵기도 하고 힘들기도 하였지만 끌어주는 선생님과 동기들이있어 재밌게 공부하고 갑니다 ^^ 1차 프로젝트는 시간이 짧으니 멘탈 깨질 각오 하시고 오시구요 ^^;", "y": "2021", "n": 0}, {"t": "5개월간 수강을 마치며", "d": "2021-04-15", "a": "박성수", "v": 353, "u": "03_후기모음/posts/145_2021-04-15_5개월간 수강을 마치며.html", "i": "", "s": "비전공자이라 할 수 있을까? 고민도 컷지만 어엿한 개발자로 만들어준 스마트미디어 인재 개발원 bb 고민하지 마시고 모두들 도전하세요.", "y": "2021", "n": 0}, {"t": "수강후기", "d": "2021-04-15", "a": "강건우", "v": 457, "u": "03_후기모음/posts/146_2021-04-15_수강후기.html", "i": "", "s": "정신없이 교육받다보니 여기까지 왔네요. 같이 교육받으신 분들 많이 정들었고 교육수준도 꽤 만족스러웠습니다. 수료하니 아쉽기는 하지만 이제 현업으로~~", "y": "2021", "n": 0}, {"t": "빅데이터 6개월 과정을 마치면서", "d": "2021-04-16", "a": "김효성", "v": 335, "u": "03_후기모음/posts/147_2021-04-16_빅데이터 6개월 과정을 마치면서.html", "i": "", "s": "먼저 6개월동안 프로젝트를 수행하면서 팀원들과 동고동락했던 경험들이 좋은 추억으로 남을 것 같습니다. 빅데이터 과정을 수강하면서 처음에는 전공이기는 했으나, 한 번도 들어본 적 없는 과목이었기에 반신반의했지만, 친절하고 능력있는 강사님들 덕분에 모든 …", "y": "2021", "n": 0}, {"t": "약 6개월간에 코딩입문기", "d": "2021-04-16", "a": "신지민", "v": 310, "u": "03_후기모음/posts/148_2021-04-16_약 6개월간에 코딩입문기.html", "i": "", "s": "비전공자로써 IT 분야 입문한다는게 쉽지않은 선택이였고 입문하고서도 여러모로 적응하는데 많이 힘들었다. 하지만 ! 이곳 선생님들과 함께하는 동기들 덕에 극복할 수 있었고 또 이렇게 3번에 프로젝트를 거쳐 수료까지 하게 되었습니다. 약 6개월동안 많은 …", "y": "2021", "n": 0}, {"t": "감사합니다!!!!", "d": "2021-04-16", "a": "변진애", "v": 348, "u": "03_후기모음/posts/149_2021-04-16_감사합니다!!!!.html", "i": "", "s": "길다면 긴 시간이지만 친절한 선생님들과 좋은 동기들 덕분에 재미있게 수업을 듣고 팀프로젝트를 할 수 있었습니다. 취업을 하는데 필요한 많은 걸 배웠고 팀프로젝트를 하면서 포트폴리오를 만드는 기반을 쌓을 수 있었습니다. 학생들을 위해 잘 챙겨주시고 많은…", "y": "2021", "n": 0}, {"t": "비전공자 추천!!", "d": "2021-04-16", "a": "vv1108", "v": 320, "u": "03_후기모음/posts/150_2021-04-16_비전공자 추천!!.html", "i": "", "s": "좋은 쌤들과 수강생들과 함께 교육을 받고 프로젝트 경험을 받을 수 있어 행복했습니다 강추합니다 !!!!!!!!!!!!!!!!!!!!!", "y": "2021", "n": 0}, {"t": "6개월간의 동고동락", "d": "2021-04-16", "a": "qkrtjwls8546", "v": 300, "u": "03_후기모음/posts/151_2021-04-16_6개월간의 동고동락.html", "i": "", "s": "길게 느껴졌던 6개월이 지나오고 나니 짧게만 느껴지는 날들이었습니다. 열정넘치는 선생님들의 가르침 아래에서 무럭무럭 자랄수 있었던 날들이었습니다. 너무 감사했습니다.", "y": "2021", "n": 0}, {"t": "빅데이터 교육을 마치며..", "d": "2021-04-16", "a": "범효진", "v": 319, "u": "03_후기모음/posts/152_2021-04-16_빅데이터 교육을 마치며.html", "i": "", "s": "비전공자에 제로베이스를 가지고 있어 걱정이 참 많았지만 무사히 잘 마치게 도와주셔서 정말 감사합니다!!!", "y": "2021", "n": 0}, {"t": "수강후기", "d": "2021-04-16", "a": "배승희", "v": 328, "u": "03_후기모음/posts/153_2021-04-16_수강후기.html", "i": "", "s": "비전공자 였는데 수강하는데 있어서 선생님들의 도움으로 크게 어려움은 없었습니다~ 재밌게 잘 들었고 좋은 교육이었습니다~", "y": "2021", "n": 0}, {"t": "수강후기", "d": "2021-04-16", "a": "Jung Min Kim", "v": 353, "u": "03_후기모음/posts/154_2021-04-16_수강후기.html", "i": "", "s": "안녕하세요. 빅데이터 분석 서비스을 수강한 학생입니다. 그동안 배우면서 수강후기 마쳤습니다.", "y": "2021", "n": 0}, {"t": "K디지털-빅데이터 분석서비스 개발자과정 수강후기", "d": "2021-04-16", "a": "김예찬", "v": 387, "u": "03_후기모음/posts/155_2021-04-16_K디지털-빅데이터 분석서비스 개발자과정 수강후기.html", "i": "", "s": "6개월 동안 열정적인 선생님 동기들과 많은 것을 배울 수 있는 시간이었습니다. 선생님들 강의도 꼼꼼하게 잘해주시고 컴퓨터도 GPU 탑재 되있어 성능이 좋습니다. 수고한 선생님들 동기들 모두 감사드립니다.", "y": "2021", "n": 0}, {"t": "빅데이터 분석 전문가 과정", "d": "2021-04-16", "a": "유형완", "v": 292, "u": "03_후기모음/posts/156_2021-04-16_빅데이터 분석 전문가 과정.html", "i": "", "s": "6개월간 프로젝트를 진행하면서 실력향상의 기회가 되고 친구처럼 대해주는 선생님들 덕에 시간가는줄 모르고 수업에 집중할 수 있던 시간이였습니다.", "y": "2021", "n": 0}, {"t": "병관쌤bb", "d": "2021-04-16", "a": "김송희", "v": 309, "u": "03_후기모음/posts/157_2021-04-16_병관쌤bb.html", "i": "", "s": "비전공자였는데 강사님들이 이해하기 쉽게 재밌게 수업을 해주셨어요~ 특히 담임쌤을 잘만나서 즐거운 6개월의 과정을 마쳤습니다 감사합니다!", "y": "2021", "n": 0}, {"t": "스마트인재개발원 수료하였습니다", "d": "2021-04-16", "a": "이중훈", "v": 323, "u": "03_후기모음/posts/158_2021-04-16_스마트인재개발원 수료하였습니다.html", "i": "", "s": "좀더 발전된 제가 될수있어서 좋은 시간이였던것 같습니다. 6개월이란 시간동안 지치기도 했지만 그만큼 의미있게 끝난것 같습니다.", "y": "2021", "n": 0}, {"t": "빅데이터 과정", "d": "2021-04-16", "a": "jinuk6727", "v": 334, "u": "03_후기모음/posts/159_2021-04-16_빅데이터 과정.html", "i": "", "s": "제가 부족했던 부분을 채울 수 있어서 좋았던 것 같고, 새로운 부분도 알 수 있어서 좋았습니다.", "y": "2021", "n": 0}, {"t": "iot과정 수료후기", "d": "2021-05-06", "a": "장경환", "v": 329, "u": "03_후기모음/posts/160_2021-05-06_iot과정 수료후기.html", "i": "", "s": "이 과정을 듣기 전에는 비전공자인 내가 이 과정을 수료하고 취업할 수 있을까? 걱정이 많았었다. 지금 생각해 보니 정말 쓸데없는 걱정이었던 것 같다. 누구나 열심히 할 생각이 있다면 무난하게 수료할 수 있고 취업할 수 있다고 생각 든다 다른 직업 훈련…", "y": "2021", "n": 0}, {"t": "스마트인재개발원 후기", "d": "2021-05-06", "a": "정영헌", "v": 536, "u": "03_후기모음/posts/161_2021-05-06_스마트인재개발원 후기.html", "i": "", "s": "저는 컴퓨터과학과를 다니고 있는 대학생입니다. 그만큼 컴퓨터에 관련해서 관심이 있었는데요. 어느 날 우연히 IoT 교육 과정이 있다는 광고를 보게 되고 바로 신청을 하려고 했습니다. 하지만 대학을 졸업해야 하는데요(저는 여기서 떨어질 까봐 불안했습니다…", "y": "2021", "n": 0}, {"t": "IOT 수료 이후", "d": "2021-05-06", "a": "김한수", "v": 338, "u": "03_후기모음/posts/162_2021-05-06_IOT 수료 이후.html", "i": "", "s": "대학교에서 배웠던 내용들이 뒤죽박죽으로 머릿속에 들여 있었는데 스마트인재개발원에 의해서 제가 가졌던 지식들이 하나하나 나열되고 정의를 할 수 있게 되어 감사했습니다.", "y": "2021", "n": 0}, {"t": "지능형IoT융합SW전문가과정", "d": "2021-05-06", "a": "송지민", "v": 343, "u": "03_후기모음/posts/163_2021-05-06_지능형IoT융합SW전문가과정.html", "i": "", "s": "Print도 모르던 비전공자에게 세번의 프로젝트를 진행할 수 있기까지 많은 도움 주셔서 감사합니다.", "y": "2021", "n": 0}, {"t": "iot 반을 마치며", "d": "2021-05-06", "a": "dylee", "v": 328, "u": "03_후기모음/posts/164_2021-05-06_iot 반을 마치며.html", "i": "", "s": "처음에는 이 과정을 잘 들 -05-06_IOT 개발자 과정 수강 후기.html", "i": "", "s": "5개월 간 3번의 프로젝트를 수행하고 마치며 여러 일들이 있었지만 지나고 보면 또 하나의 추억과 나의 포트폴리오 한 페이지를 만들어주셔서 너무 감사했습니다. 커리큘럼도 체계적이고, 좋은 선생님들과 좋은 수강생들과 함께 해서 너무 좋았습니다 개발자가 되…", "y": "2021", "n": 0}, {"t": "지능형 IoT 과정 수료 후기", "d": "2021-05-06", "a": "김명훈", "v": 336, "u": "03_후기모음/posts/172_2021-05-06_지능형 IoT 과정 수료 후기.html", "i": "", "s": "선생님들이 너무 잘 가르쳐주셔서 단기간동안 실력이 월등히 향상되었습니다. 앞으로 it취업에 있어서 큰 도움이 될 것 같습니다. 감사합니다. 남들은 서울 올라가서 한 달에 400만원 주고 컴퓨터 교육 듣는 다는데 광주에 이런 좋은 컴퓨터 직업학원이 있다…", "y": "2021", "n": 0}, {"t": "굳이 서울 갈 필요 없습니다. ~", "d": "2021-05-06", "a": "wlsgh0809", "v": 343, "u": "03_후기모음/posts/173_2021-05-06_굳이 서울 갈 필요 없습니다. ~.html", "i": "", "s": "교육의 질과 커리큘럼, 그리고 강사진 때문에 서울에서 배워야 하나 고민하시는 분들 많으실거라 생각합니다 저 역시도 그중 한명이었구요. 걱정반 설렘반으로 입학하고 막상 배워 보니 생각이상으로 너무 좋았습니다. 취업 연계로 이어지는 탄탄한 커리큘럼과 선생…", "y": "2021", "n": 0}, {"t": "지능형 IoT 과정 수료 후기 //재밌네요", "d": "2021-05-06", "a": "이동호", "v": 361, "u": "03_후기모음/posts/174_2021-05-06_지능형 IoT 과정 수료 후기 재밌네요.html", "i": "", "s": "재밌게 잘 배우고 유익했습니다.", "y": "2021", "n": 0}, {"t": "잘 배우고 갑니다.", "d": "2021-05-06", "a": "이수빈", "v": 314, "u": "03_후기모음/posts/175_2021-05-06_잘 배우고 갑니다.html", "i": "", "s": "5개월이 전혀 아깝지 않을 정도로 좋은 수업이였습니다. 늦기 전에 다른분들도 어서 빨리 시작하셨으면 좋겠습니다. 좋은 수업 너무너무 감사했고 아쉽기도하고 배운 점이 많아 좋기도하고 그렇습니다허허. 다시 한 번 좋은 수업 감사했습니다. 선생님들 복 많이…", "y": "2021", "n": 0}, {"t": "880시간동안 감사했습니다.", "d": "2021-05-06", "a": "안상철", "v": 328, "u": "03_후기모음/posts/176_2021-05-06_880시간동안 감사했습니다.html", "i": "", "s": "저에게 개발자라는 좋은 기회를 선물 해 주신 담임선생님과 지금까지 함께 고생한 우리 팀원들, 학원생분들 모두 감사합니다. 다들 세련된 곳에 취업해서 사원증 차고 만납시다. 화이탕!", "y": "2021", "n": 0}, {"t": "5개월동안 잘 배우고 갑니다!", "d": "2021-05-06", "a": "김창수", "v": 375, "u": "03_후기모음/posts/177_2021-05-06_5개월동안 잘 배우고 갑니다!.html", "i": "", "s": "학원에 처음 들어올 때에는 모두를 경쟁상대로 생각하고 1등할 목적이었는데 다들 괴물이었습니다. 가장 좋았던 것은 경쟁이 아닌 서로서로 도와주는 것이었습니다. 대가없이 도움을 주고 받을 수 있다는 사실이 5개월을 버티게 해준 이유가 아닐까 생각해보며 새…", "y": "2021", "n": 0}, {"t": "지능형 IoT 과정 수료 후기", "d": "2021-05-06", "a": "조권우", "v": 357, "u": "03_후기모음/posts/178_2021-05-06_지능형 : "인공지능융합서비스 6개월 후기", "d": "2021-05-13", "a": "문종진", "v": 391, "u": "03_후기모음/posts/185_2021-05-13_인공지능융합서비스 6개월 후기.html", "i": "", "s": "어떤 IT과정을 들을 지 망설이고 있다면 가장 해보고 싶은 것을 선택하세요~ 여러분들이 어떤 과정을 수강해도 좋아요~ 6개월의 시간동안 많은 걸 얻어가세요~ 지영쌤, 성우쌤 감사했어요! 그럼 저는 이만!", "y": "2021", "n": 0}, {"t": "? 2020 디지털 핵심 실무인재 양성사업 - 인공지능 융합서비스 개발자과정 [ '20.11 ~ 21.05' ]", "d": "2021-05-13", "a": "이재성", "v": 409, "u": "03_후기모음/posts/186_2021-05-13_2020 디지털 핵심 실무인재 양성사업 - 인공지능 융합서비스 개발자과정 [ '20.11 ~ 21.05' ].html", "i": "", "s": "6개월 과정을 마치고 취업준비에 들어갔습니다. 비전공자라 따라가기 힘든부분이 많았지만 친절한 선생님들과 팀원들의 도움으로 무사히 과정을 수료했습니다. 특히 팀 프로젝트가 많아서 도움이 많이 되었습니다. 정말 많이 배우고 갑니다. 취업까지 화이팅!! 손…", "y": "2021", "n": 0}, {"t": "인공지능 융합서비스 개발자과정", "d": "2021-05-13", "a": "박찬얼", "v": 451, "u": "03_후기모음/posts/187_2021-05-13_인공지능 융합서비스 개발자과정.html", "i": "", "s": "이번 수업을 들으면서 학교에서 배울 수 없었던 개발적인 부분이나 지식 등을 얻을 수 있어서 좋았습니다. 또 취업에 대해 조금 막막했는데 인재 개발원에 다녀서 필요한 기초 지식들을 쌓고 취업에 많은 도움이 될 거 같습니다. 5개월동안 강의하신 선생님들 …", "y": "2021", "n": 0}, {"t": "지영쌤이 잊지 못할 첫 제자♥ <인공지능반>", "d": "2021-05-14", "a": "nfms3636", "v": 481, "u": "03_후기모음/posts/188_2021-05-14_지영쌤이 잊지 못할 첫 제자♥ 인공지능반.html", "i": "", "s": "전공생임에도 불구하고 학교에서 배운 지식이 제한적이라고 생각하여 스마트인재개발원에 오게되었습니다. 스마트인재개발원 인공지능 과정을 들으면서 보다 넓은 공부를 할 수 있었으며 새로운 공부를 하면서 배운점이 많았던것 같습니다. 특히 많이 부족하다고 생각했…", "y": "2021", "n": 1}, {"t": "NCS 기반 인공지능 융합서비스 개발자과정 비전공자 후기", "d": "2021-05-14", "a": "김유경", "v": 511, "u": "03_후기모음/posts/189_2021-05-14_NCS 기반 인공지능 융합서비스 개발자과정 비전공자 후기.html", "i": "", "s": "4차 산업 혁명, IT시대 등 개발자에 대한 필요성이 증가되면서 더불어 제 관심도 늘어났습니다. 하지만 혼자서 공부하려고 하니, 의지도 생기지도 않고 비전공자라서 베이스도 없다보니 막막 했습니다. 그렇게 프로그래밍 공부를 포기하려던 찰나, 스마트인재개…", "y": "2021", "n": 0}, {"t": "? 잊지 못할 인공지능 융합 개발자 과정 _with 지영/성우쌤", "d": "2021-05-14", "a": "이예은", "v": 455, "u": "03_후기모음/posts/190_2021-05-14_잊지 못할 인공지능 융합 개발자 과정 _with 지영 성우쌤.html", "i": "", "s": "전공은 이쪽 이였지만 프로젝트 경험이 부족하다 생각하여 학교에서 알아보던 중 스마트인재개발원을 알게되었고 그 중 인공지능 융합 개발자 과정을 이수하였습니다. 처음 기초부터 심화 내용까지 탄탄하게 잡아주시고 매 수업 커리큘럼이 잘 짜져 있어 너무 좋았습…", "y": "2021", "n": 0}, {"t": "NCS 기반 인공지능 융합 개발자 과정 후기", "d": "2021-05-14", "a": "정철화", "v": 455, "u": "03_후기모음/posts/191_2021-05-14_NCS 기반 인공지능 융합 개발자 과정 후기.html", "i": "", "s": "비전공자이고 많은 힘든 점이 있었지만 선생님들 덕분에 차근차근 배운 좋은 시간이었던 것 같습니다. 프로젝트 팀을 하면서 팀원들 간의 좋은 추억도 많이 쌓을 수 있었고 간접적으로나마 프로그램 개발 진행을 할 수 있어 즐거웠습니다. 우리 인공지능반 학생들…", "y": "2021", "n": 1}, {"t": "5개월 수강 후기", "d": "2021-05-14", "a": "EUNNA GO", "v": 419, "u": "03_후기모음/posts/192_2021-05-14_5개월 수강 후기.html", "i": "", "s": "비전공자라서 혼자 공부하기 힘들어서 학원 등록하게 되었습니다. 이곳에서 선생님들이 많이 도와주고, 프로젝트도 함께하고 짝꿍도 있어서 잘 배울 수 있었습니다. 아 그리고 노트북도 지원해줘서 무사히 마칠 수 있었습니다. 이제 취업만 남았는데 취업도 잘 되…", "y": "2021", "n": 0}, {"t": "인공지능 융합 개발자 과정 후기", "d": "2021-05-14", "a": "노현직", "v": 360, "u": "03_후기모음/posts/193_2021-05-14_인공지능 융합 개발자 과정 후기.html", "i": "", "s": "5개월이라는 시간 동안 3번의 프로젝트를 하면서 많은 선생님들, 팀원, 동기들을 만나며 의미 있는 시간을 보낸 거 같습니다. 고생하신 선생님들 너무 감사드리고 동기분들도 앞으로 좋은일만 가득하시길 바라겠습니다. 감사합니다!", "y": "2021", "n": 0}, {"t": "즐거웠습니다~", "d": "2021-05-14", "a": "오승효", "v": 416, "u": "03_후기모음/posts/194_2021-05-14_즐거웠습니다~.html", "i": "", "s": "짧다는 짧고 길다면 긴 시간동안 많이 배워서 가는것같습니다 그동안 지영 쌤,성우 쌤 수고많으셨고 길가다가 만나면 인사해요~ 모른척하고 지나가기 없이~~~ 그럼 이만 가보도록하겟습니다 언제어디서나 화이팅하시길 또 행복하시길 굿바이~~", "y": "2021", "n": 0}, {"t": "수강 후기", "d": "2021-05-14", "a": "박연하", "v": 374, "u": "03_후기모음/posts/195_2021-05-14_수강 후기.html", "i": "", "s": "처음 왔을 때는 기간이 길다고 생각을 했었는데 생각보다 너무 빨리 지나간 것 같아서 놀랐습니다!!! 낯선 공간에서 적응이 쉽지 않았는데 지영 쌤이 도와주셔서 너무 감사했어요!! 전공자로서 배우지 못하였던 새로운 것도 배워서 뿌듯했습니다!!! 정말 감사…", "y": "2021", "n": 0}, {"t": "최고의 강의 최고의 강사 최고의 학원", "d": "2021-05-14", "a": "bbcjk444", "v": 437, "u": "03_후기모음/posts/196_2021-05-14_최고의 강의 최고의 강사 최고의 학원.html", "i": "", "s": "NCS 기반 인공지능 융합 개발자 과정 후기 비전공자 이지만 선생님들 덕분에 차근차근 배운 좋은 시간이었던 것 같습니다. 기초부터 인공지능까지 배울수있어서 정말 커리큐럼 대박!!!! 프로젝트 하면서 팀원들 간의 좋은 추억도 많이 쌓을 수 있었고 프로그…", "y": "2021", "n": 3}, {"t": "수강후기", "d": "2021-05-14", "a": "monster2307", "v": 701, "u": "03_후기모음/posts/197_2021-05-14_수강후기.html", "i": "", "s": "5개월동안 다양한 분야를 공부해보면서 진로 결정에도 큰 도움이 됐고 프로젝트를 통해 배운 것들을 응용해 보면서 많이 배운거 같아요. 그동안 제 질문 폭탄에도 자세히 알려주시고 프로젝트도 많이 도와주신 쌤들 정말 감사합니다!", "y": "2021", "n": 0}, {"t": "여기부터 반등인가?! 인생의 터닝포인트!", "d": "2021-05-14", "a": "임주홍", "v": 395, "u": "03_후기모음/posts/198_2021-05-14_여기부터 반등인가 ! 인생의 터닝포인트!.html", "i": "", "s": "나이도 제일 많을 것이라 생각했고, 비 전공자, 다른 공부, 다른 업무를 하다 온 상황이라 걱정도 많고 불안함도 가득 안고 시작했는데, 너무 재밌고 만족스러운 교육을 받고 갑니다. 솔직히 불안한 마음은 아직 남아있지만 그래도 할 수 있다는 자신감 만큼…", "y": "2021", "n": 0}, {"t": "수강 후기", "d": "2021-05-14", "a": "이명주", "v": 530, "u": "03_후기모음/posts/199_2021-05-14_수강 후기.html", "i": "", "s": "5개월동안 프로젝트 하면서 많은 경험 쌓을 수 있었습니당! 동기들과 선생님들 모두 정말 좋은 분들만 있어서 많은 추억 쌓고 즐겁게 학원 수업 수강했던거같아요!! 프로그래밍 언어랑 머신러닝,딥러닝도 쉽게 알려주셔서 많이많이 배웠습니당~~ 취업하는데 도움…", "y": "2021", "n": 0}, {"t": "수강후기", "d": "2021-05-14", "a": "류보윤", "v": 408, "u": "03_후기모음/posts/200_2021-05-14_수강후기.html", "i": "", "s": "약 5개월동안 좋은 담임선생님과 각 과목 선생들께서 훌륭한 커리큘럼을 통해 아주 만족스러운 교육을 받을 수 있었습니다. 수강동기들도 너무 좋았고 화목한 분위기에서 수강할수 있어서 재밌었습니다. 취업연계까지 신경써주시는 선생님들 감사하고 좋은곳으로 들어…", "y": "2021", "n": 0}, {"t": "수강후기", "d": "2021-05-14", "a": "양가람", "v": 413, "u": "03_후기모음/posts/201_2021-05-14_수강후기.html", "i": "", "s": "5개월 동안 학원에서 비전공자로서는 쉽게 할 수 없는 재밌고 알찬 경험들을 많이 할 수 있어서 너무 좋았습니다. 처음에는 따라가기 힘들었는데 학원에서 보충도 잘 해주고 이론 뿐 만 아니라 실제로 서비스를 만드는 과정도 너무 재밌었습니다. 또 취업 준비…", "y": "2021", "n": 0}, {"t": "5개월간 선생님들 너무 고생하셨습니다", "d": "2021-05-14", "a": "dud0880", "v": 407, "u": "03_후기모음/posts/202_2021-05-14_5개월간 선생님들 너무 고생하셨습니다.html", "i": "", "s": "아무것도 모르는 비루한 저를 사람으로 만들어 주셨습니다. 너무 감사드리고 고생 많이 하셨습니다. 돈 많이 벌어서 맛있는거 사드릴게요~", "y": "2021", "n": 0}, {"t": "♥귀요미의 인공지능 융합 서비스 개발자 과정 후기♥", "d": "2021-05-14", "a": "이승연", "v": 413, "u": "03_후기모음/posts/203_2021-05-14_♥귀요미의 인공지능 융합 서비스 개발자 과정 후기♥.html", "i": "", "s": "전공이지만 전공에 자신이 없어서 다른길로 갈까 생각도 했는데 이 과정을 통해서 도전할 수 있는 용기를 얻고 갑니다!! 5개월동안 저희 옆에서 서포트 해주신 연구원님들, TA분들 감사드리고 가끔씩 들어와 좋은 이야기 해주신 원장님을 비롯해 실장님들 감사…", "y": "2021", "n": 0}, {"t": "인공지능반 모두들 감사합니다~", "d": "2021-05-14", "a": "성주환", "v": 394, "u": "03_후기모음/posts/204_2021-05-14_인공지능반 모두들 감사합니다~.html", "i": "", "s": "교육 기간 동안 IT 교육 뿐만 아니라 여러가지를 배우고 갑니다! 5개월이라는 시간이 이렇게 : "", "s": "혼자서 공부하면서 취업을 준비 했다면, 할 수 없었을 팀 프로젝트를 경험할 수 있어서 더욱 뜻 깊은 6개월 이었습니다. 워낙 탄탄한 기관이라는건 알고 있었기 때문에, 프로그래밍 지식은 당연히 얻어갈 거라고 생각했습니다. 하지만 체계적인 여러 단계 속에…", "y": "2021", "n": 0}, {"t": "5개월(108일)간의 수강후기.", "d": "2021-12-09", "a": "최한글", "v": 577, "u": "03_후기모음/posts/240_2021-12-09_5개월(108일)간의 수강후기.html", "i": "", "s": "처음에 생각보다 넓고 깨끗한 학원 환경에 놀랬습니다. 파이썬 수업을 시작으로 자바, 웹 크롤링, 머신러닝,딥러닝, 리눅스, 스프링 등등 정말 많은 과목을 들었어요. 중간중간 면접 교육, 포트폴리오 작성법, 등 여러 외부 강사님들도 오셔서 취업에 대해 …", "y": "2021", "n": 0}, {"t": "5개월간 정말 좋은 경험이였습니다!!", "d": "2021-12-10", "a": "이건ㅇ", "v": 498, "u": "03_후기모음/posts/241_2021-12-10_5개월간 정말 좋은 경험이였습니다!!.html", "i": "", "s": "비공자였지만 연구원님들이 쉽고 재밌게 수업해주셔서 이해하는데 도움이 많이 됐습니다! 5개월간 좋은 경험할 수 있어서 정말 좋았고 담임선생님인 최태양연구원님도 최고였습니당!!", "y": "2021", "n": 0}, {"t": "5개월동안 진짜 감사했습니다", "d": "2021-12-10", "a": "최지수", "v": 458, "u": "03_후기모음/posts/242_2021-12-10_5개월동안 진짜 감사했습니다.html", "i": "", "s": "비전공이지만 너무 세세하게 잘 가르쳐 주시고 선생님들이 이야기가 잘 통해서 너무 좋았어요 ㅠㅠ", "y": "2021", "n": 0}, {"t": "벌써 수료라니 ...", "d": "2021-12-11", "a": "박시현", "v": 483, "u": "03_후기모음/posts/243_2021-12-11_벌써 수료라니.html", "i": "", "s": "혼자 하려 하면 도대체 뭐부터 배워야 할지 내가 무엇을 하고 싶은지 망막한데 수료하고 나니 내가 뭘 배워야 할지 훤하게 보이네요 취업시장 긴장해라... 스마트점심개발원은 이제 스마트직장생활개발원으로…. 다들 안녕히!", "y": "2021", "n": 0}, {"t": "많은 것을 얻어갈 수 있었던 시간이었습니다. 감사합니다!", "d": "2022-01-05", "a": "조현중", "v": 553, "u": "03_후기모음/posts/244_2022-01-05_많은 것을 얻어갈 수 있었던 시간이었습니다. 감사합니다!.html", "i": "", "s": "수강하기 전까지는 파이썬, C#과 같은 프로그래밍 언어의 기초만 알고 있었던 상태였습니다. 기초 문법을 실무로 어떻게 사용하는 지 모르는 상황에서 수강을 했습니다. 처음 자바 부터 시작해서, DB, 안드로이드, 인공지능을 공부하면서 실무에 접근할 수 …", "y": "2022", "n": 0}, {"t": "짧은 시간 동안 다양한 경험을 할 수 있습니다.", "d": "2022-01-05", "a": "강성희", "v": 516, "u": "03_후기모음/posts/245_2022-01-05_짧은 시간 동안 다양한 경험을 할 수 있습니다.html", "i": "", "s": "5개월이라는 시간 동안 정말 다양한 경험을 쌓아서 좋았습니다. 처음 수료한 학생들의 최종 프로젝트 발표를 보고 내가 할 수 있을까 라는 의문을 가졌는데 짧은 시간임에도 다양한 경험을 통해 프로젝트를 마칠 수 있었습니다. 다른 사람들과의 프로젝트로 즐거…", "y": "2022", "n": 0}, {"t": "5개월간 의미있는 시간", "d": "2022-01-05", "a": "이지호", "v": 523, "u": "03_후기모음/posts/246_2022-01-05_5개월간 의미있는 시간.html", "i": "", "s": "5개월 동안 비전공자로 어렵게 느껴지긴 했지만 수료시점엔 잘선택했다고 생각이 드네요. 좋은 사람들도 많이 알게되고 많은 것을 배워가고 발판을 삼아 더 도약하겠습니다.", "y": "2022", "n": 0}, {"t": "인공지능 서비스 개발자과정 수료", "d": "2022-01-05", "a": "이도현", "v": 577, "u": "03_후기모음/posts/247_2022-01-05_인공지능 서비스 개발자과정 수료.html", "i": "", "s": "처음 시작은 공부가 너무 어렵고 체력적으로 힘들었지만, 열정적인 선생님들의 도움을 받으며 학생들과 함께 프로젝트를 진행해가면서 열정적이고 즐겁게 5개월을 마무리 할 수 있었습니다. 모두들 고생하셨습니다!", "y": "2022", "n": 0}, {"t": "인공지능 과정 수강후기", "d": "2022-01-05", "a": "이다온", "v": 526, "u": "03_후기모음/posts/248_2022-01-05_인공지능 과정 수강후기.html", "i": "", "s": "해당 분야에 전혀 지식이 없는 상태에서 왔는데 약 5개월의 기간 동안 많은걸 배우며 느낀 것도 있고, 좋은 사람들도 만나서 보람있고 좋았던 시간이었습니다. 감사합니다.", "y": "2022", "n": 0}, {"t": "만족스러웠던 교육!", "d": "2022-01-05", "a": "곽호찬", "v": 497, "u": "03_후기모음/posts/249_2022-01-05_만족스러웠던 교육!.html", "i": "", "s": "걱정을 많이 했는데 선생님들도 친절하고 힘든 부분도 잘 가르쳐주셔서 수업 내용을 따라가기 조금 더 수월했던 것 같다. 여러 과목을 가르쳐주기 때문에 나에게 맞는 분야를 알 수 있었다. 따로 추가로 다른 수업을 들어도 다시 오고 싶을 정도로 기관이 마음…", "y": "2022", "n": 0}, {"t": "비전공자라 걱정이 많았지만 잘 배울 수 있었습니다", "d": "2022-01-05", "a": "김현석", "v": 543, "u": "03_후기모음/posts/250_2022-01-05_비전공자라 걱정이 많았지만 잘 배울 수 있었습니다.html", "i": "", "s": "시작하기 앞서 걱정이 많았지만 체계적으로 잘 배울 수 있었고, 과정이 마무리되고 취업 부분도 해결이 되었습니다 교육에서 취업 연계까지 도움을 많이 받았습니다.", "y": "2022", "n": 0}, {"t": "수강후기:)", "d": "2022-01-05", "a": "이태희", "v": 836, "u": "03_후기모음/posts/251_2022-01-05_수강후기 ).html", "i": "", "s": "선생님들께서 천천히 잘 알려주셔서 무사히 수료할 수 있었습니다? 짱짱~ ❤️미희쌤?", "y": "2022", "n": 0}, {"t": "광주/전남에서는 여기가 최고인 것 같습니다", "d": "2022-01-05", "a": "함지희", "v": 600, "u": "03_후기모음/posts/252_2022-01-05_광주 전남에서는 여기가 최고인 것 같습니다.html", "i": "", "s": "다들 검색하느라 힘빼지 마시고 걍 여기 오세요. 특히 비전공자분들 못따라갈까 걱정하지마세요 비전공자가 대부분이에요. 여기 단과과정이라도 찍먹해보세요. 백수보단 낫습니다.?", "y": "2022", "n": 0}, {"t": "후회없는 선택", "d": "2022-01-05", "a": "박시온", "v": 564, "u": "03_후기모음/posts/253_2022-01-05_후회없는 선택.html", "i": "", "s": "5개월동안 빠듯하게 배웠지만 얻은 것이 참 많았습니다. 본인의 경쟁력을 올리고 싶다면 꼭 추천드립니다. 다만, 한 번 해볼까? 하고 들어오시면 엄청난 학습량에 멘붕이 오실 수 있으니 어느정도 각오는 하고 오시는게 좋습니다. 프로젝트 포트폴리오 2개가 …", "y": "2022", "n": 0}, {"t": "아주 유익한 시간이었습니다!", "d": "2022-01-05", "a": "최진태", "v": 500, "u": "03_후기모음/posts/254_2022-01-05_아주 유익한 시간이었습니다!.html", "i": "", "s": "다양한 수업을 들으며 많은 지식을 쌓을 수 있었고, 팀프로젝트를 통해 반 친구들과 즐겁게 학원을 다닐 수 있었습니다. 후회없는 선택이었습니다.", "y": "2022", "n": 0}, {"t": "인공지능서비스개발자과정 후기", "d": "2022-01-05", "a": "김지윤", "v": 570, "u": "03_후기모음/posts/255_2022-01-05_인공지능서비스개발자과정 후기.html", "i": "", "s": "오개월의 과정이지만 알차게 이루어져 있어서 두 번의 프로젝트 경험으로 포폴까지 만들 수 있었습니다! 비전공자를 기준으로 수업이 진행되기 때문에 따라가는게 어렵지 않았어요~ 모두들 코딩이라는 단어에 두려워 마시고취업까지 보장되는 스마트인재개발원 과정에 …", "y": "2022", "n": 0}, {"t": "감사합니다", "d": "2022-01-05", "a": "최현준", "v": 536, "u": "03_후기모음/posts/256_2022-01-05_감사합니다.html", "i": "", "s": "가벼운 마음으로 한 번 해볼까 하고 들어왔는데, 고등학생 때로 다시 돌아간 것 같았습니다 ㅋㅋ 하지만 시간이 지나고 수료를 하고나니 힘들었던 시간들이 헛된 시간이 아니라 값진 시간이었다는 생각이 듭니다. 함께 힘든 시간을 버티며 고생한 강사님들, 수강…", "y": "2022", "n": 0}, {"t": "시간 순간 삭제,,", "d": "2022-01-05", "a": "박가연", "v": 590, "u": "03_후기모음/posts/257_2022-01-05_시간 순간 삭제,,.html", "i": "", "s": "다른 업종에서 일하다가 아이티로 전향하려고 이곳에 등록했는데 처음엔 아주 막막했습니다. 5개월이라는게 사실상 짧다고 느끼진 않았으니까요 하지만 자바부터 시작해서 자바페스티벌, 1차 프로젝트, 2차 프로젝트 너무나도 좋은 사람들과 함께 즐겁게 지내다 보…", "y": "2022", "n": 0}, {"t": "인공지능 서비스 개발자 과정 수료 후기", "d": "2022-01-05", "a": "정경훈", "v": 577, "u": "03_후기모음/posts/258_2022-01-05_인공지능 서비스 개발자 과정 수료 후기.html", "i": "", "s": "길면 길고 짧으면 짧은 5개월 간 새로운 내용을 배우고 다양한 분들과 좋은 경험을 쌓을 수 있어서 값진 과정이었다고 생각합니다. 개발에 대한 경험과 목표를 갖게 해주셔서 감사합니다.", "y": "2022", "n": 0}, {"t": "6개월,,,,,,", "d": "2022-01-05", "a": "이진화", "v": 723, "u": "03_후기모음/posts/259_2022-01-05_6개월,,,,,,.html", "i": "", "s": "아무것도 모르는 비전공자였는데 코딩 배우고 싶다는 마음만 가지고 가벼운 마음으로 왔다가 머리 씨게 맞앗읍니다,, 그래도 배우는동안 재밌었고 같이 배우는 사람들이랑도 재밌는 시간이였어요. 다들 고생했고 절거웟읍니다~", "y": "2022", "n": 0}, {"t": "알찬 5개월이었습니다!", "d": "2022-02-04", "a": "김지현", "v": 518, "u": "03_후기모음/posts/260_2022-02-04_알찬 5개월이었습니다!.html", "i": "", "s": "열정적인 에너지와 함께 많은 것들을 5개월동안 배워갈 수 있는 시간이었습니다! 선생님들께서도 열정이 넘치시고 본인이 열정을 가진만큼 지식과 스펙을 얻어가실 수 있습니다. 활발하고 모두와 융합을 잘하는 성격이실수록 더 좋습니다! 두번의 실질적인 프로젝트…", "y": "2022", "n": 0}, {"t": "실력 const $ = s => document.querySelector(s);
let board = 'live';

const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 로컬 파일 경로는 구간별로 인코딩한다. 파일명에 % & # 가 들어 있어도 안전하다.
const local = u => (u || '').split('/').map(encodeURIComponent).join('/');
const href = u => board === 'news' ? (u || '') : local(u);

function current(){
  const q = $('#q').value.trim().toLowerCase();
  const y = $('#yr').value, s = $('#sort').value;
  const list = DATA[board].filter(it => {
    if (y && it.y !== y) return false;
    if (!q) return true;
    return ((it.t||'') + ' ' + (it.s||'') + ' ' + (it.a||'') + ' ' + (it.c||'')).toLowerCase().includes(q);
  });
  list.sort((a, b) => s === 'view' ? (b.v - a.v)
                    : s === 'old'  ? a.d.localeCompare(b.d)
                    : b.d.localeCompare(a.d));
  return list;
}

function card(it){
  const th = it.i
    ? '<img src="' + local(it.i) + '" loading="lazy" alt="">'
    : '<span class="ph">' + esc((it.t || '?').trim().charAt(0)) + '</span>';
  const meta = [it.d, it.a].filter(Boolean).map(esc).join(' · ');
  const extra = board === 'news'
    ? (it.c ? '<span class="pill">' + esc(it.c) + '</span>' : '')
    : '<span>조회 ' + it.v + '</span>' + (it.n ? '<span>사진 ' + it.n + '</span>' : '');
  return '<a class="card" href="' + href(it.u) + '" target="_blank" rel="noopener">'
       + '<div class="thumb">' + th + '</div><div class="cbody">'
       + '<div class="ctitle">' + esc(it.t) + '</div>'
       + (it.s ? '<div class="csnip">' + esc(it.s) + '</div>' : '')
       + '<div class="cmeta">' + extra + '<span>' + meta + '</span></div></div></a>';
}

function row(it, i){
  return '<a class="row" href="' + href(it.u) + '" target="_blank" rel="noopener">'
       + '<span class="rno">' + (i + 1) + '</span><span class="rmain">'
       + '<span class="rtitle">' + esc(it.t) + '</span>'
       + (it.s ? '<div class="rsnip">' + esc(it.s) + '</div>' : '')
       + '</span><span class="rmeta">' + esc(it.a) + '<br>' + esc(it.d)
       + ' · 조회 ' + it.v + '</span></a>';
}

function render(){
  const list = current();
  $('#cnt').textContent = list.length + '건';
  const out = $('#out');
  if (!list.length){
    out.innerHTML = '<div class="empty">조건에 맞는 게시글이 없습니다.</div>';
    return;
  }
  out.innerHTML = board === 'rev'
    ? '<div class="rows">' + list.map(row).join('') + '</div>'
    : '<div class="grid">' + list.map(card).join('') + '</div>';
}

function renderYT(){
  const box = $('#yt');
  if (board !== 'rev' || !DATA.yt.length){ box.innerHTML = ''; return; }
  box.innerHTML = '<div class="ytwrap"><h3>현장스케치 · 인터뷰 영상 ' + DATA.yt.length + '개</h3>'
    + '<div class="ytlist">'
    + DATA.yt.map((u, i) => '<a href="' + u + '" target="_blank" rel="noopener">영상 ' + (i+1) + '</a>').join('')
    + '</div></div>';
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t));
  board = t.dataset.b;
  $('#sort').value = 'new';
  renderYT();
  render();
}));
['#q', '#yr', '#sort'].forEach(s => $(s).addEventListener('input', render));

renderYT();
render();
</script></body></html>
